<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./styles.css" />
        <title>Othello</title>
    </head>
    <body>
        <main class="layout">
            <section class="panel">
                <h1>Othello / Reversi</h1>

                <label for="mode">Game mode</label>
                <select id="mode">
                    <option value="ai">Player vs AI</option>
                    <option value="local">Local 1v1</option>
                    <option value="online">Online 1v1</option>
                </select>

                <div id="aiControls" class="group">
                    <label for="difficulty">AI difficulty</label>
                    <select id="difficulty">
                        <option value="easy">Easy</option>
                        <option value="normal">Normal</option>
                        <option value="hard">Hard</option>
                    </select>
                </div>

                <div id="onlineControls" class="group hidden">
                    <label for="roomIdInput">Room code</label>
                    <input id="roomIdInput" maxlength="6" placeholder="ABC123" />
                    <div class="row">
                        <button id="createRoomBtn" type="button">Create room</button>
                        <button id="joinRoomBtn" type="button">Join room</button>
                    </div>
                    <p class="small">Share your room code with a friend.</p>
                </div>

                <button id="restartBtn" type="button">Restart game</button>

                <div class="scoreboard">
                    <p><strong>Black:</strong> <span id="blackScore">2</span></p>
                    <p><strong>White:</strong> <span id="whiteScore">2</span></p>
                </div>

                <p class="status" id="statusText">Black to move.</p>
                <p class="meta" id="metaText"></p>
            </section>

            <section>
                <div class="board" aria-label="Othello board"></div>
            </section>
        </main>

        <script src="/socket.io/socket.io.js"></script>
        <script src="./script.js"></script>
    </body>
</html>
